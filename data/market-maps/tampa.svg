<svg class="market-map__svg" viewBox="0 0 640 520" role="img" aria-labelledby="market-map-title market-map-desc" xmlns="http://www.w3.org/2000/svg">
<title id="market-map-title">Map of the 50-mile circle around downtown Tampa</title>
<desc id="market-map-desc">A 50-mile circle centered on downtown Tampa covers Tampa and St. Petersburg, Brooksville and Spring Hill to the north, Zephyrhills, Plant City and Lakeland to the east, and Bradenton to the south. Tampa Bay and the edge of the Gulf are on the west side. Every part of it is in Florida.</desc>
