<svg class="market-map__svg" viewBox="0 0 640 520" role="img" aria-labelledby="market-map-title market-map-desc" xmlns="http://www.w3.org/2000/svg">
<title id="market-map-title">Map of the 50-mile circle around Arlington</title>
<desc id="market-map-desc">A 50-mile circle centered on Arlington, midway between Dallas and Fort Worth, covers both cities and their suburbs, from Denton, Frisco and McKinney in the north to Cleburne and Waxahachie in the south, and from Weatherford in the west to Rockwall in the east. Every part of it is in Texas. The Red River, the Oklahoma line, touches the top edge of the map.</desc>
