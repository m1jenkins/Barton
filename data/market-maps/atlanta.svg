<svg class="market-map__svg" viewBox="0 0 640 520" role="img" aria-labelledby="market-map-title market-map-desc" xmlns="http://www.w3.org/2000/svg">
<title id="market-map-title">Map of the 50-mile circle around downtown Atlanta</title>
<desc id="market-map-desc">A 50-mile circle centered on downtown Atlanta covers the city and its suburbs from Kennesaw and Alpharetta in the north to Peachtree City and McDonough in the south, and from Douglasville in the west to Conyers and Covington in the east. Every part of it is in Georgia.</desc>
