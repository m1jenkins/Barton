<svg class="market-map__svg" viewBox="0 0 640 520" role="img" aria-labelledby="market-map-title market-map-desc" xmlns="http://www.w3.org/2000/svg">
<title id="market-map-title">Map of the 50-mile circle around downtown Phoenix</title>
<desc id="market-map-desc">A 50-mile circle centered on downtown Phoenix covers the Phoenix valley, from Surprise and Buckeye in the west to Apache Junction and Queen Creek in the east, and from Carefree in the north to Casa Grande in the south. Every part of it is in Arizona.</desc>
<rect width="640" height="520" fill="#E3ECF8"/>
<path d="M-4 524L-4 -4L644 -4L644 524Z" fill="#FFFFFF" stroke="#C3CBD6" stroke-width="1" fill-rule="evenodd"/>
<path d="" fill="none" stroke="#465061" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round"/>
<circle cx="320" cy="260" r="190" fill="#1A4B8C" fill-opacity=".07" stroke="#1A4B8C" stroke-width="2"/>
<text x="139.2" y="443.3" text-anchor="middle" class="mm-region">ARIZONA</text>
<circle cx="354.1" cy="161.9" r="3" fill="#0E1B2E"/><text x="361.1" y="165.9" text-anchor="start" class="mm-place mm-minor">Carefree</text><circle cx="255.6" cy="212.6" r="3" fill="#0E1B2E"/><text x="248.6" y="216.6" text-anchor="end" class="mm-place">Surprise</text><circle cx="295.5" cy="236.3" r="3" fill="#0E1B2E"/><text x="288.5" y="248.3" text-anchor="end" class="mm-place">Glendale</text><circle cx="398.1" cy="217.2" r="3" fill="#0E1B2E"/><text x="391.1" y="221.2" text-anchor="end" class="mm-place">Fountain Hills</text><circle cx="257.9" cy="263.4" r="3" fill="#0E1B2E"/><text x="250.9" y="267.4" text-anchor="end" class="mm-place">Goodyear</text><circle cx="208.4" cy="280.5" r="3" fill="#0E1B2E"/><text x="208.4" y="298.5" text-anchor="middle" class="mm-place">Buckeye</text><circle cx="373.1" cy="268.7" r="3" fill="#0E1B2E"/><text x="380.1" y="272.7" text-anchor="start" class="mm-place">Mesa</text><circle cx="434.8" cy="268.7" r="3" fill="#0E1B2E"/><text x="441.8" y="272.7" text-anchor="start" class="mm-place mm-minor">Apache Junction</text><circle cx="370.9" cy="297.3" r="3" fill="#0E1B2E"/><text x="377.9" y="301.3" text-anchor="start" class="mm-place">Chandler</text><circle cx="416.3" cy="312.4" r="3" fill="#0E1B2E"/><text x="423.3" y="316.4" text-anchor="start" class="mm-place mm-minor">Queen Creek</text><circle cx="325.8" cy="362.4" r="3" fill="#0E1B2E"/><text x="332.8" y="366.4" text-anchor="start" class="mm-place">Maricopa</text><circle cx="389.3" cy="409.3" r="3" fill="#0E1B2E"/><text x="382.3" y="413.3" text-anchor="end" class="mm-place">Casa Grande</text>
