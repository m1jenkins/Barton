<svg class="market-map__svg" viewBox="0 0 640 520" role="img" aria-labelledby="market-map-title market-map-desc" xmlns="http://www.w3.org/2000/svg">
<title id="market-map-title">Map of the 50-mile circle around downtown San Francisco</title>
<desc id="market-map-desc">A 50-mile circle centered on downtown San Francisco covers the Bay Area from Santa Rosa and Petaluma in the north to San Jose in the south, and from the Pacific coast to Livermore and Walnut Creek in the east. San Francisco Bay and San Pablo Bay sit inside it. Every part of it that is land is in California.</desc>
