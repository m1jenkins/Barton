<svg class="market-map__svg" viewBox="0 0 640 520" role="img" aria-labelledby="market-map-title market-map-desc" xmlns="http://www.w3.org/2000/svg">
<title id="market-map-title">Map of the 50-mile circle around downtown Los Angeles</title>
<desc id="market-map-desc">A 50-mile circle centered on downtown Los Angeles covers the city, the San Fernando Valley, Santa Clarita, the San Gabriel Valley, Orange County and the western Inland Empire as far as Ontario and Corona. Every part of it is in California; the Pacific Ocean fills the southwest side.</desc>
