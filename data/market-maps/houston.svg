<svg class="market-map__svg" viewBox="0 0 640 520" role="img" aria-labelledby="market-map-title market-map-desc" xmlns="http://www.w3.org/2000/svg">
<title id="market-map-title">Map of the 50-mile circle around downtown Houston</title>
<desc id="market-map-desc">A 50-mile circle centered on downtown Houston covers the city and its suburbs, from Katy and Sugar Land in the west to Baytown and Liberty in the east, and from Conroe and The Woodlands in the north to Pearland, League City and Galveston in the south. Every part of it is in Texas, so there are no state lines on this map. Galveston Bay fills the southeast side.</desc>
